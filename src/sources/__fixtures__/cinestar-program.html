obile":632,"imageKiosk":636,"__typename":637},"2428554","Manželé Svobodovi vyrážejí na dovolenou zachránit svůj vztah. Místo romantiky je ale čeká série bláznivých katastrof, které všechno obrátí vzhůru nohama!","left",[608],{"czTitle":609,"enTitle":609,"uri":610,"Description":611,"MovieDubbing":538,"Movie3D":538,"MovieSubtitles":538,"Cinemas":612,"PictureUrl":616,"moviePoster":617,"CSFD":618,"__typename":542},"Dovolená v Českém ráji","filmy\u002Fmovie\u002F10870-dovolena-v-ceskem-raji","Manželství Milana a Týny Svobodových se v posledních měsících proměnilo v sérii malých i větších nedorozumění, ve kterých se dokážou pohádat už téměř o cokoliv. Dovolená se tak jeví jako správná volba k záchraně vztahu. Jenže co když si ji každý představuje jinak? Milan má slabost pro českou přírodu a je nadšený z představy spaní pod širákem, zatímco Týna by se nejraději viděla u moře. Kemp v Českém ráji vnímá spíše jako kompromis. Už od příjezdu se i zdánlivě obyčejné věci mění v komické katastrofy, které postupně narůstají. Místo odpočinku se mezi nimi dusno jen stupňuje. Po neočekávané příhodě na hradě Trosky se rozhodnou zkusit něco úplně jiného – být chvíli od sebe. Možná tak konečně zjistí, co je v životě opravdu důležité….",[613],{"col1":614,"cinemaid":614,"__typename":615},"0","Cinemas_TableRow","https:\u002F\u002Fimage.pmgstatic.com\u002Fcache\u002Fresized\u002Fw600h1000\u002Ffiles\u002Fimages\u002Ffilm\u002Fposters\u002F171\u002F378\u002F171378703_2e12gg.jpg",[],[619],{"Videos":620,"__typename":624},[621],{"Url":622,"SubtitlesUrl":286,"__typename":623},"https:\u002F\u002Fvideo.pmgstatic.com\u002Ffiles\u002Fvideos\u002F157\u002F908\u002F157908164\u002F171502034_56xnhf.mp4","Videos_TableRow","CSFD_base_BlockType",[626],{"title":627,"url":628,"__typename":234},"2024 Film tydne template 6","https:\u002F\u002Fcraft.cinestar.cz\u002Fassets\u002Fimages\u002Fdesktop\u002F_1920xAUTO_fit_center-center_70_none\u002F2428630\u002F2024-Film-tydne-template-6.jpeg",[630],{"title":627,"url ženkyně Skye), hasit požáry (dalmatin Marshall), strážit zákon (německý ovčák Chase) a dělat spoustu dalších užitečných věcí (ostatní čtyřnozí chlupáči), milují děti po celém světě. \u003Ca href=\"https:\u002F\u002Fwww.csfd.cz\u002Ffilm\u002F358219-tlapkova-patrola\u002F\">Stejnojmenný televizní seriál\u003C\u002Fa> láme rekordy ve sledovanosti, stejně se vede prodeji hraček a podobně se dařilo jejich dvěma filmovým dobrodružstvím.\u003Cbr \u002F>A teď je tu další film a spolu s ním i výprava Tlapkové patroly na tajuplný ostrov mimo civilizaci, na kterém dosud žijí dinosauři. O tomhle kolosálním objevu se bohužel dozví i starosta Humdinger, největší nepřítel psích záchranářů, který navíc zjistí, že se na ostrově nalézá také obří naleziště diamantů. Ty jsou pro něj mnohem zajímavější než přerostlé ještěrky. Rozhodne se je vytěžit s pomocí dynamitu, aby to šlo rychleji, bohužel si nevšimne, že se kousek od diamantového dolu nalézá spící sopka, kterou pár výbuchů dozajista probudí. V tu chvíli přijde na řadu Tlapková patrola a její záchranná operace, jejímž cílem bude dostat všechny dinosaury do bezpečí. Bude to dobrodružné, bude to napínavé, bude to Vaúúúú!",[679,680,681,682,683,684,685,687,688,689,690,692,693],{"col1":356,"cinemaid":356,"__typename":615},{"col1":526,"cinemaid":526,"__typename":615},{"col1":197,"cinemaid":197,"__typename":615},{"col1":110,"cinemaid":110,"__typename":615},{"col1":40,"cinemaid":40,"__typename":615},{"col1":8,"cinemaid":8,"__typename":615},{"col1":686,"cinemaid":686,"__typename":615},"7",{"col1":66,"cinemaid":66,"__typename":615},{"col1":49,"cinemaid":49,"__typename":615},{"col1":74,"cinemaid":74,"__typename":615},{"col1":691,"cinemaid":691,"__typename":615},"11",{"col1":70,"cinemaid":70,"__typename":615},{"col1":694,"cinemaid":694,"__typename":615},"14","https:\u002F\u002Fimage.pmgstatic.com\u002Fcache\u002Fresized\u002Fw600h1000\u002Ffiles\u002Fimages\u002Ffilm\u002Fposters\u002F171\u002F429\u002F171429192_9rggrh.jpg",[],[698],{"Videos
