name: ingest

# The whole product runs from here: this workflow scrapes both chains and
# publishes the dashboard. There is no server and no database.
#
# Scheduling lives in GitHub rather than on a host because GitHub-hosted
# runners are unmetered for public repositories, which is what makes a
# five-minute cadence free.
#
# Two things worth knowing:
#   * GitHub queues scheduled runs and drops them under load, so ticks are
#     "roughly every five minutes", not exact. The poller copes — it works a
#     due-queue, so a skipped tick just means more to do on the next one.
#   * Scheduled workflows are disabled after 60 days with no repository
#     activity. Push something, or re-enable them in the Actions tab.
on:
  schedule:
    - cron: "*/5 * * * *"
    # Refreshing the CineStar programme costs 12 page fetches plus one
    # event lookup per newly listed screening, so it runs on its own slower beat.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: Also refresh the CineStar schedule
        type: boolean
        default: true

concurrency:
  # Two runs writing the same published state would lose one of them.
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CINESTAR_API_KEY: ${{ secrets.CINESTAR_API_KEY }}
      SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
      JOB_BUDGET_MS: "180000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore previous data
        # The published branch is also the datastore. Nothing here can be
        # re-scraped after the fact, so a failure to restore must stop the run
        # rather than quietly start from an empty history.
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git checkout FETCH_HEAD -- data
            echo "restored $(du -sh data | cut -f1) of previous data"
          else
            echo "no published branch yet — first run, starting empty"
          fi

      - name: Ingest
        run: |
          if [ "${{ github.event.schedule }}" = "7 */6 * * *" ] || [ "${{ inputs.discover }}" = "true" ]; then
            npm run ingest -- discover
          else
            npm run ingest
          fi

      - name: Publish
        run: |
          rm -rf _site && mkdir _site
          cp -r site/. _site/
          cp -r data _site/data
          # Prevent Pages' Jekyll step from swallowing anything.
          touch _site/.nojekyll

          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)"
          # A fresh single-commit branch every time, so the repository does not
          # grow by a megabyte of state every five minutes.
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
