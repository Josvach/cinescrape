name: ingest

# The whole product runs from here: this workflow scrapes both chains and
# publishes the dashboard. There is no server and no database.
#
# The trigger is hourly, but the job iterates every five minutes internally.
#
# That split is deliberate. A "*/5" cron does not actually run every five
# minutes: GitHub queues short-interval schedules and drops them under load, and
# on this repository it produced two runs in three hours instead of thirty-six.
# Since a screening's occupancy becomes unreadable the moment it starts, missing
# the last reading loses that number permanently — so the cadence cannot depend
# on the scheduler. An hourly trigger is fired reliably, and the job holds the
# runner and does the pacing itself.
#
# Scheduled workflows are disabled after 60 days with no repository activity.
# Push something, or re-enable them in the Actions tab.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

concurrency:
  # Two runs writing the same published state would lose one of them.
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Stops short of the next hourly trigger so two jobs never write the same
    # published state.
    timeout-minutes: 56
    env:
      CINESTAR_API_KEY: ${{ secrets.CINESTAR_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
      JOB_BUDGET_MS: "180000"
      LOOP_MINUTES: "50"
      LOOP_INTERVAL_SECONDS: "300"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore previous data
        # The published branch is also the datastore. Nothing here can be
        # re-scraped after the fact, so a failure to restore must stop the run
        # rather than quietly start from an empty history.
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git checkout FETCH_HEAD -- data
            echo "restored $(du -sh data | cut -f1) of previous data"
          else
            echo "no published branch yet — first run, starting empty"
          fi

      - name: Scrape and publish every five minutes for the rest of the hour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Each iteration publishes, so the dashboard moves on its own cadence
          # rather than once when the job finally exits.
          PUBLISH_CMD: bash scripts/publish.sh
        run: npm run ingest -- loop
