name: ingest

# Scheduling lives here rather than in vercel.json because Vercel's Hobby tier
# only fires cron once a day. GitHub-hosted runners are free and unmetered for
# public repositories, which is what makes a five-minute cadence free.
#
# Two caveats worth knowing:
#   * GitHub queues scheduled runs and drops them under load, so ticks are
#     "roughly every five minutes", not exact. The poller is written to cope —
#     it works a due-queue, so a skipped tick just means more work next time.
#   * Scheduled workflows are disabled after 60 days with no repository
#     activity. Push something, or re-enable them in the Actions tab.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: cinemacity
        type: choice
        options: [cinemacity, cinestar-halls, cinestar-schedule, settle]

concurrency:
  # Never let a slow run overlap the next tick against the same database.
  group: ingest-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CINESTAR_API_KEY: ${{ secrets.CINESTAR_API_KEY }}
      SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
      # Three jobs share a five-minute tick, so each gets well under it.
      JOB_BUDGET_MS: "80000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pick jobs for this tick
        id: pick
        run: |
          case "${{ github.event.schedule || format('manual:{0}', inputs.job) }}" in
            "*/5 * * * *")  echo "jobs=cinemacity cinestar-halls settle" >> "$GITHUB_OUTPUT" ;;
            "0 */6 * * *")  echo "jobs=cinestar-schedule"                >> "$GITHUB_OUTPUT" ;;
            manual:*)       echo "jobs=${{ inputs.job }}"                >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run
        run: |
          for job in ${{ steps.pick.outputs.jobs }}; do
            npx tsx src/cli/run-job.ts "$job"
          done
