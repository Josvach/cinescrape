name: ingest

# The whole product runs from here: this workflow scrapes both chains and
# publishes the dashboard. There is no server and no database.
#
# The trigger is hourly, but the job iterates every five minutes internally.
#
# That split is deliberate. A "*/5" cron does not actually run every five
# minutes: GitHub queues short-interval schedules and drops them under load, and
# on this repository it produced two runs in three hours instead of thirty-six.
# Since a screening's occupancy becomes unreadable the moment it starts, missing
# the last reading loses that number permanently — so the cadence cannot depend
# on the scheduler. An hourly trigger is fired reliably, and the job holds the
# runner and does the pacing itself.
#
# The hourly trigger is not reliable either, only better. Measured over the
# 38 runs before this was written: gaps of one to four hours, and on a Monday
# morning nothing between 08:33 and 11:06 — the window the weekend's official
# numbers land in. So there are two schedules half an hour apart. They cannot
# overlap (the concurrency group queues the second one), which makes the later
# cron a standby that only does anything when the earlier one was dropped.
#
# Scheduled workflows are disabled after 60 days with no repository activity.
# Push something, or re-enable them in the Actions tab.
on:
  schedule:
    - cron: "13 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Natáhnout celý archiv UFD (jednorázově, ~6 minut)"
        type: boolean
        default: false

concurrency:
  # Two runs writing the same published state would lose one of them, so the
  # hourly schedule never overlaps itself.
  #
  # A manual run preempts instead of queueing. The job holds its runner for
  # fifty minutes, so waiting would mean up to an hour before anything a person
  # asked for actually happened — and cancelling costs almost nothing, because
  # the loop publishes after every iteration and reloads its state from the
  # published branch when it restarts.
  group: ingest
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Overlap is prevented by the concurrency group, not by this; the ceiling is
    # here so a wedged run releases the runner instead of blocking the queued
    # standby behind it for six hours.
    timeout-minutes: 56
    env:
      CINESTAR_API_KEY: ${{ secrets.CINESTAR_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
      JOB_BUDGET_MS: "180000"
      LOOP_MINUTES: "50"
      LOOP_INTERVAL_SECONDS: "300"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore previous data
        # The published branch is also the datastore. Nothing here can be
        # re-scraped after the fact, so a failure to restore must stop the run
        # rather than quietly start from an empty history.
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git checkout FETCH_HEAD -- data
            echo "restored $(du -sh data | cut -f1) of previous data"
          else
            echo "no published branch yet — first run, starting empty"
          fi

      - name: Backfill the UFD archive
        # Ten years of weekly reports, fetched once. Weeks already stored are
        # skipped, so re-running costs almost nothing.
        if: inputs.backfill
        env:
          BACKFILL_BUDGET_MS: "1500000"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Published straight away rather than waiting for the first scrape
        # iteration, so the archive is on the page as soon as it is downloaded.
        run: |
          npm run ingest -- backfill
          bash scripts/publish.sh

      - name: Scrape and publish every five minutes for the rest of the hour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Each iteration publishes, so the dashboard moves on its own cadence
          # rather than once when the job finally exits.
          PUBLISH_CMD: bash scripts/publish.sh
        run: npm run ingest -- loop
