<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CineScrape — živá návštěvnost kin</title>
    <meta name="description" content="Živá návštěvnost filmů v českých multikinech." />
    <!--
      GitHub Pages is public, and a public repository is what makes the
      schedule free. Keeping the page out of search indexes is the part of
      privacy that is still available: the URL stays obscure rather than
      discoverable.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CineScrape" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 22V10h3.2v12zm6.4 0V10h3.2v12zm6.4 0V10H24v12z' fill='white'/%3E%3C/svg%3E"
    />
    <style>
      /*
       * Palette slots come from a validated categorical set: slot 1 (blue) and
       * slot 2 (orange), checked against both surfaces — lightness band, chroma
       * floor, colourblind separation, normal-vision separation and contrast
       * all pass in light and dark.
       */
      :root {
        color-scheme: light;
        --surface-0: #f4f4f2;
        --surface-1: #fcfcfb;
        --surface-2: #ececea;
        --border: #dcdcd8;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --text-muted: #77766f;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --warning: #9a6700;
        --radius: 14px;
        --navheight: 58px;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --surface-0: #111110;
          --surface-1: #1a1a19;
          --surface-2: #232322;
          --border: #33332f;
          --text-primary: #ffffff;
          --text-secondary: #c3c2b7;
          --text-muted: #94938a;
          --series-1: #3987e5;
          --series-2: #d95926;
          --warning: #d0a215;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --surface-0: #111110;
        --surface-1: #1a1a19;
        --surface-2: #232322;
        --border: #33332f;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #94938a;
        --series-1: #3987e5;
        --series-2: #d95926;
        --warning: #d0a215;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--surface-0);
        color: var(--text-primary);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 14px;
        /* Room for the fixed bar plus the home indicator on a modern phone. */
        padding-bottom: calc(var(--navheight) + env(safe-area-inset-bottom) + 20px);
      }

      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 14px 2px 12px; position: sticky; top: 0; z-index: 5;
        background: var(--surface-0);
      }
      .topbar .brand { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
      /* Two short lines rather than one long one: on a narrow phone the build
         and the timestamp together do not fit beside the brand. */
      .topbar .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: none; }
      .topbar .stamp { color: var(--text-muted); font-size: 11.5px; }
      .topbar .version {
        font-size: 10px; font-weight: 620; letter-spacing: 0.05em; text-transform: uppercase;
        color: var(--text-secondary); background: var(--surface-2);
        border-radius: 999px; padding: 1px 7px; white-space: nowrap;
      }
      .topbar .back {
        background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
        color: var(--series-1); font-size: 15px; font-weight: 560;
      }

      /* Bottom bar: the only navigation, always within thumb reach. */
      nav.bottom {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: grid; grid-template-columns: repeat(3, 1fr);
        background: color-mix(in srgb, var(--surface-1) 92%, transparent);
        backdrop-filter: saturate(180%) blur(12px);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav.bottom .tab {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; height: var(--navheight); background: none; border: 0; cursor: pointer;
        font: inherit; font-size: 10.5px; letter-spacing: 0.02em;
        color: var(--text-muted); -webkit-tap-highlight-color: transparent;
      }
      nav.bottom .tab.active { color: var(--series-1); font-weight: 620; }
      nav.bottom .tab:active { opacity: 0.6; }

      .card {
        background: var(--surface-1); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 15px; margin-bottom: 12px;
      }
      .card > h2 {
        font-size: 12.5px; font-weight: 620; letter-spacing: 0.03em; text-transform: uppercase;
        color: var(--text-secondary); margin: 0 0 3px;
      }
      .card > .caption { font-size: 12px; color: var(--text-muted); margin: 0 0 13px; }

      .eyebrow {
        font-size: 11px; font-weight: 620; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--series-2); margin-bottom: 6px;
      }
      .herofilm {
        display: block; width: 100%; text-align: left; background: none;
        border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer;
      }
      .herotitle {
        font-size: clamp(20px, 6vw, 26px); font-weight: 660; line-height: 1.2;
        letter-spacing: -0.01em; margin-bottom: 6px; overflow-wrap: anywhere;
      }
      .hero {
        font-variant-numeric: tabular-nums; font-size: clamp(40px, 13vw, 58px);
        font-weight: 690; letter-spacing: -0.035em; line-height: 1; margin: 2px 0 3px;
      }
      .hero-unit { font-size: 12.5px; color: var(--text-secondary); }
      .subtitle { margin: -10px 0 14px; font-size: 12.5px; color: var(--text-muted); }

      .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 16px; }
      @media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .tile { background: var(--surface-2); border-radius: 11px; padding: 11px; }
      .tile .label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .tile .value { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 630; letter-spacing: -0.02em; margin-top: 2px; }
      .tile .note { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

      .rank {
        display: flex; align-items: flex-start; gap: 11px; padding: 10px 0;
        border-top: 1px solid var(--border); cursor: pointer; width: 100%;
        background: none; border-left: 0; border-right: 0; border-bottom: 0;
        text-align: left; color: inherit; font: inherit;
      }
      .rank.static { cursor: default; }
      .rank:first-of-type { border-top: none; }
      .rank .pos { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-muted); width: 20px; flex: none; text-align: right; padding-top: 2px; }
      .rank .body { min-width: 0; flex: 1; }
      .rank .name { display: block; font-weight: 570; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
      .rank .meta { display: block; font-size: 11.5px; line-height: 1.35; color: var(--text-muted); margin-top: 1px; }
      .rank .num { font-variant-numeric: tabular-nums; text-align: right; flex: none; width: 82px; }
      .rank .num b { display: block; font-size: 16px; font-weight: 640; letter-spacing: -0.01em; line-height: 1.2; }
      .rank .num span { display: block; font-size: 10.5px; color: var(--text-muted); line-height: 1.3; }

      .sharebar { display: block; height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
      .sharebar > i { display: block; height: 100%; border-radius: 2px; background: var(--series-1); }

      .notice {
        display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px;
        color: var(--text-secondary); background: var(--surface-2);
        border-radius: 11px; padding: 10px 12px; margin-top: 10px;
      }
      .notice.warn { color: var(--warning); }

      table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
      table.data th, table.data td { text-align: right; padding: 7px 4px; border-top: 1px solid var(--border); white-space: nowrap; }
      table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; }
      table.data th { color: var(--text-muted); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; border-top: none; }
      table.data .sub { display: block; color: var(--text-muted); font-size: 11px; margin-top: 1px; }
      .linkish {
        background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
        color: var(--series-1); text-align: left;
      }

      details.tableview > summary { cursor: pointer; font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }
      .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--text-secondary); margin-top: 9px; }
      .legend .key { display: inline-flex; align-items: center; gap: 6px; }
      .legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

      .axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
      .daylabels {
        display: flex; font-size: 10px; color: var(--text-muted); margin-top: 3px;
      }
      .daylabels span { flex: 1; text-align: center; }
      .daylabels span.now { color: var(--series-1); font-weight: 640; }
      .readout { display: flex; align-items: baseline; gap: 8px; min-height: 32px; flex-wrap: wrap; }
      .readout b { font-size: 23px; font-weight: 640; font-variant-numeric: tabular-nums; }
      .readout span { font-size: 11.5px; color: var(--text-muted); }

      .empty { color: var(--text-muted); font-size: 13px; padding: 14px 0; text-align: center; }
      h3.sub { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 620; margin: 15px 0 3px; }
      svg { display: block; overflow: visible; }

      .masthead { padding: 4px 0 14px; }
      .masthead h1 { font-size: 21px; font-weight: 660; letter-spacing: -0.015em; margin: 0; line-height: 1.25; }

      /* Rating sits beside the title as a chip, not as a competing headline. */
      .rating {
        display: inline-flex; align-items: baseline; gap: 5px;
        background: var(--surface-2); border-radius: 999px; padding: 3px 10px;
        font-size: 11.5px; color: var(--text-secondary); margin-left: 8px;
        vertical-align: middle; white-space: nowrap;
      }
      .rating b { font-size: 13px; font-weight: 640; color: var(--text-primary); font-variant-numeric: tabular-nums; }

      /* Marks a figure as the association's official national number rather
         than our own measurement — the two are not the same thing. */
      .official {
        display: inline-block; font-size: 9.5px; text-transform: uppercase;
        letter-spacing: 0.05em; color: var(--series-2); border: 1px solid currentColor;
        border-radius: 3px; padding: 0 3px; margin-left: 5px; vertical-align: 1px;
        font-weight: 620;
      }

      .article {
        display: block; padding: 11px 0; border-top: 1px solid var(--border);
        color: inherit; text-decoration: none;
      }
      .article:first-of-type { border-top: none; }
      .article .head { display: block; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
      .article .meta { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
      .article .tag {
        display: inline-block; font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--series-2); border: 1px solid currentColor;
        border-radius: 4px; padding: 0 4px; margin-right: 6px; vertical-align: 1px;
      }
    </style>
  </head>
  <body>
    <main class="page" id="app">
      <p class="empty">Načítám…</p>
    </main>
    <nav class="bottom" id="nav" aria-label="Hlavní navigace"></nav>
    <script type="module" src="app.js"></script>
  </body>
</html>
